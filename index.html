<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Exército Dourado | Gestão da Bateria</title>
<style>
:root{--gold:#d4af37;--gold2:#f0cf62;--bg:#0b0b0b;--card:#151515;--line:#292929;--text:#f5f5f5;--muted:#a8a8a8;--danger:#d9534f}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(145deg,#080808,#17130a);color:var(--text)}
header{padding:24px 18px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.72);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:14px;max-width:1100px;margin:auto}.logo{width:52px;height:52px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:25px}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
main{max-width:1100px;margin:auto;padding:20px 16px 50px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.hero h2{margin:0;font-size:27px}.hero p{color:var(--muted);margin:6px 0 0}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:#111}.secondary{background:#242424;color:#fff}.danger{background:#3a1717;color:#ff9d99}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:14px}.stat b{font-size:25px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.panel{background:rgba(20,20,20,.9);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:220px}
input,select{width:100%;background:#0e0e0e;border:1px solid #333;border-radius:9px;padding:12px;color:#fff;outline:none}input:focus,select:focus{border-color:var(--gold)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--gold2);font-size:11px;text-transform:uppercase}td small{color:var(--muted)}.actions{display:flex;gap:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#171717;border:1px solid #3b3b3b;border-radius:18px;padding:20px}.box h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}.full{grid-column:1/-1}.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}table{min-width:760px}.panel{overflow-x:auto}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🥁</div><div><h1>BATERIA EXÉRCITO DOURADO</h1><p>Gestão de Ritmistas • Unidos do Beco</p></div></div></header>
<main>
<section class="hero"><div><h2>Painel da Bateria</h2><p>Controle dos ritmistas e informações da tropa.</p></div><button class="primary" onclick="openModal()">+ Novo ritmista</button></section>
<section class="stats">
<div class="stat"><b id="total">0</b><span>Ritmistas cadastrados</span></div>
<div class="stat"><b id="presentes">0</b><span>Presença marcada</span></div>
<div class="stat"><b id="camisetas">0</b><span>Camisas cadastradas</span></div>
<div class="stat"><b id="instrumentos">0</b><span>Instrumentos</span></div>
</section>
<section class="panel">
<div class="toolbar"><input id="search" placeholder="Buscar por nome, instrumento ou telefone..." oninput="render()"><select id="filter" onchange="render()"><option value="">Todos os instrumentos</option></select><button class="secondary" onclick="exportar()">Exportar CSV</button></div>
<div style="overflow:auto"><table><thead><tr><th>Ritmista</th><th>Instrumento</th><th>Camiseta</th><th>Fantasia</th><th>Calçado</th><th>Presença</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
</main>

<div class="modal" id="modal"><div class="box">
<h3 id="modalTitle">Novo ritmista</h3>
<form id="form" onsubmit="save(event)">
<input type="hidden" id="id">
<div class="grid">
<div class="field"><label>NOME COMPLETO</label><input id="nome" required></div>
<div class="field"><label>TELEFONE</label><input id="telefone" placeholder="(55) 99999-9999"></div>
<div class="field"><label>INSTRUMENTO</label><select id="instrumento" required><option value="">Selecione</option><option>Surdo de 1ª</option><option>Surdo de 2ª</option><option>Surdo de 3ª</option><option>Repique</option><option>Caixa</option><option>Tamborim</option><option>Agogô</option><option>Chocalho</option><option>Cuíca</option><option>Outro</option></select></div>
<div class="field"><label>TAMANHO CAMISETA</label><select id="camiseta"><option value="">Selecione</option><option>P</option><option>M</option><option>G</option><option>GG</option><option>EXG</option><option>G1</option><option>G2</option><option>G3</option></select></div>
<div class="field"><label>TAMANHO FANTASIA</label><select id="fantasia"><option value="">Selecione</option><option>P</option><option>M</option><option>G</option><option>GG</option><option>G3</option></select></div>
<div class="field"><label>NÚMERO DO CALÇADO</label><input id="calcado" type="number" min="20" max="55"></div>
<div class="field full"><label>OBSERVAÇÕES</label><input id="obs" placeholder="Ex.: diretor, naipe, observações..."></div>
</div>
<div class="footer-actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar ritmista</button></div>
</form></div></div>

<script>
const KEY='exercitoDouradoRitmistas';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(data));}
function openModal(item=null){
 $('modal').classList.add('open'); $('modalTitle').textContent=item?'Editar ritmista':'Novo ritmista';
 $('id').value=item?.id||''; $('nome').value=item?.nome||''; $('telefone').value=item?.telefone||'';
 $('instrumento').value=item?.instrumento||''; $('camiseta').value=item?.camiseta||''; $('fantasia').value=item?.fantasia||'';
 $('calcado').value=item?.calcado||''; $('obs').value=item?.obs||'';
}
function closeModal(){$('modal').classList.remove('open');$('form').reset();$('id').value='';}
function save(e){e.preventDefault();let id=$('id').value||crypto.randomUUID();let obj={id,nome:$('nome').value.trim(),telefone:$('telefone').value.trim(),instrumento:$('instrumento').value,camiseta:$('camiseta').value,fantasia:$('fantasia').value,calcado:$('calcado').value,obs:$('obs').value.trim(),presente:false};
let old=data.find(x=>x.id===id);if(old)obj.presente=old.presente;
let idx=data.findIndex(x=>x.id===id);if(idx>=0)data[idx]=obj;else data.push(obj);persist();closeModal();render();}
function togglePresenca(id){let x=data.find(x=>x.id===id);x.presente=!x.presente;persist();render();}
function del(id){if(confirm('Excluir este ritmista?')){data=data.filter(x=>x.id!==id);persist();render();}}
function edit(id){openModal(data.find(x=>x.id===id));}
function render(){
 let q=$('search').value.toLowerCase(), f=$('filter').value;
 let list=data.filter(x=>(!q||[x.nome,x.telefone,x.instrumento].join(' ').toLowerCase().includes(q))&&(!f||x.instrumento===f));
 let opts=[...new Set(data.map(x=>x.instrumento).filter(Boolean))].sort();$('filter').innerHTML='<option value="">Todos os instrumentos</option>'+opts.map(x=>`<option ${x===f?'selected':''}>${x}</option>`).join('');
 $('tbody').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(x.nome)}</b><br><small>${esc(x.telefone||'')}</small></td><td>${esc(x.instrumento)}</td><td>${esc(x.camiseta||'—')}</td><td>${esc(x.fantasia||'—')}</td><td>${esc(x.calcado||'—')}</td><td><button class="${x.presente?'primary':'secondary'}" onclick="togglePresenca('${x.id}')">${x.presente?'✓ Presente':'Marcar'}</button></td><td><div class="actions"><button class="secondary" onclick="edit('${x.id}')">Editar</button><button class="danger" onclick="del('${x.id}')">Excluir</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nenhum ritmista cadastrado.</td></tr>';
 $('total').textContent=data.length;$('presentes').textContent=data.filter(x=>x.presente).length;$('camisetas').textContent=data.filter(x=>x.camiseta).length;$('instrumentos').textContent=new Set(data.map(x=>x.instrumento).filter(Boolean)).size;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function exportar(){
 let rows=[['Nome','Telefone','Instrumento','Camiseta','Fantasia','Calçado','Presença','Observações'],...data.map(x=>[x.nome,x.telefone,x.instrumento,x.camiseta,x.fantasia,x.calcado,x.presente?'Presente':'Não marcado',x.obs])];
 let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(';')).join('\\n');
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='ritmistas-exercito-dourado.csv';a.click();
}
render();
</script>
</body></html>
